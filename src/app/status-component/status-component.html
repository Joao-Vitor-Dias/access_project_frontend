<div>

  @if (open) {

    <app-image-menu (closeMenu)="open = false"/>

  }

  <span>

    <button (click)="open = !open">

      <mat-icon>menu</mat-icon>

    </button>

  </span>

  <span class="status-options-container">


      <app-status-card [name]="nameDriverPlaceHolher"
                [functionConnection]="tryConnectionDrive"
                [functionDisconnection]="disconnectDrive"
                [alertEnumPlaceHolder]="'DRIVER'"
                [isButtonConnectWorking]="true"
                [isButtonDisconnectWorking]="true" />
      <app-status-card [name]="nameWhatsappPlaceHoler"
                [functionConnection]="closeWhatsappPopup"
                [alertEnumPlaceHolder]="'WHATSAPP'"
                [isButtonConnectWorking]="true"
                [isButtonDisconnectWorking]="false" />

  </span>


</div>
