<div>
  <h1>
    {{ name }}
  </h1>
  <button (click)="functionConnection()" [disabled]="!isButtonConnectWorking">
    <mat-icon>
      play_arrow
    </mat-icon>
  </button>
  <button (click)="functionDisconnection()" [disabled]="!isButtonDisconnectWorking">
    <mat-icon>
      cancel
    </mat-icon>
  </button>
  <span
    [class]="isClosedConnection() ? 'deactived' : 'actived'">
  </span>
</div>
